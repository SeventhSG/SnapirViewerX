<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport"
          content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- No network, no backend, no remote anything. The scan is read off the
         disk and everything after that happens in this process. blob: is here
         for the inlined parser worker and for handing a finished export back
         to the shell; data: is for the canvas thumbnail. -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self' blob: data:" />
    <title>Snapir Viewer X</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
