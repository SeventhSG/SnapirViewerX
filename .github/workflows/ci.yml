name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: Types
        run: npm run typecheck

      # Builds its own fixtures from a fixed seed, so this needs no scan data
      # in the repository and produces the same numbers on every machine.
      - name: Self test
        run: npm test

      - name: Build the interface
        run: npm run build
